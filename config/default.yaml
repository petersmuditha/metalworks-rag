# GlassBox RAG Configuration
# Generated by `glassbox-rag init`

logging:
  level: "INFO"
  format: "text"

trace:
  enabled: true
  backend: "memory"

encoding:
  default_encoder: "google"
  cloud:
    google:
      api_key: "${GOOGLE_API_KEY}"
      model: "gemini-embedding-001"
      embedding_dim: 1536

vector_store:
  type: "qdrant"
  qdrant:
    url: "https://a327d02b-fb0a-4762-a220-5bd9026c368e.eu-central-1-0.aws.cloud.qdrant.io"
    api_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6NDNkNGUxNjgtZWU2NS00NGUzLWFjZTYtNjZlMjg5NzBmYTBmIn0.B0WV0hfKpFIqv96Jc5l0zdQ9iKkwERbLSrEDHrvKwYY"
    collection_name: "metalworks_defects"

database:
  type: "sqlite"
  sqlite:
    path: "./data/glassbox.db"

retrieval:
  top_k: 5
  min_score: 0.3
  adaptive:
    enabled: true
    strategies:
      - name: "semantic"
      - name: "hybrid"
        weight_semantic: 0.6
        weight_keyword: 0.4

chunking:
  strategy: "recursive"
  chunk_size: 512
  chunk_overlap: 50

writeback:
  enabled: true
  mode: "protected"
  protected:
    confidence_threshold: 0.8

metrics:
  enabled: true
  track_tokens: true
  track_latency: true
  track_cost: true
